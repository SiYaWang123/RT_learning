<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>呼吸治療臨床情境練習</title>
<!--
  研究版學習網頁（前端）
  - 這個檔案會公開在網路上，裡面只放畫面程式和後端網址，不放題目、答案、密碼或解鎖碼。
  - 教材和題目在學生登入、主題開放後，才由後端（Google Apps Script）傳過來。
  - 外觀是風格 A（臨床監視器），只用淺色：手機設成深色模式也一樣。
  - 後端網址在下方程式最前面的 API_URL。
-->
<style>
/* ========== 風格 A：臨床監視器（只用淺色） ========== */
:root {
  color-scheme: only light;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --bg: #edf1f5; --surface: #ffffff; --surface-2: #f3f6f9; --ink: #0f172a; --muted: #4a5a70; --line: #d8e0e9;
  --accent: #0e7490; --accent-ink: #ffffff; --accent-soft: #e0f2f6; --accent-text: #0e7490;
  --ok: #146c35; --ok-soft: #e8f6ee; --bad: #b42318; --bad-soft: #fdeeec; --warn: #a15c07; --warn-soft: #fdf3e2;
  --radius: 14px; --radius-sm: 10px; --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 2px 6px rgba(15, 23, 42, .04); --ring-w: 4px;
  --accent-strong: #0b6179; --line-strong: #c2cdd9; --shadow-up: 0 2px 10px rgba(15, 23, 42, .09);
  --fs-micro: 12px; --fs-small: 13px; --fs-body: 15px; --fs-title: 17px; --fs-page: 22px;
  --w-em: 600; --w-head: 700;
}

/* ========== 共用 ========== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--fs-body);
  line-height: 1.65;
  text-autospace: normal;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button, label { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.fine { margin: 0; font-size: var(--fs-small); line-height: 1.6; color: var(--muted); }
.err {
  display: flex; align-items: flex-start; gap: 8px; margin: 6px 0 0; padding: 10px 12px;
  border-radius: var(--radius-sm); background: var(--bad-soft); color: var(--bad); font-size: var(--fs-body); font-weight: var(--w-em); line-height: 1.5;
}
.err::before {
  content: "!"; content: "!" / ""; flex: none; width: 18px; height: 18px; margin-top: 2px;
  display: grid; place-items: center; border-radius: 50%; background: var(--bad); color: var(--surface);
  font-size: var(--fs-micro); font-weight: var(--w-head); line-height: 1;
}
.err:empty { display: none; }
.save-note { margin: 4px 0 0; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn); font-size: var(--fs-small); font-weight: var(--w-em); line-height: 1.5; }

.btn {
  min-height: 48px; padding: 10px 18px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: var(--fs-title); font-weight: var(--w-em); letter-spacing: .02em; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: var(--w-head); box-shadow: 0 1px 2px rgba(15, 23, 42, .12); }
@media (hover: hover) {
  .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-strong); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
  .link-btn:hover:not(:disabled) { background: var(--accent-soft); }
  .icon-btn:hover { background: var(--surface-2); }
}
.btn:active:not(:disabled) { background: var(--surface-2); border-color: var(--line-strong); }
.btn.primary:active:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); box-shadow: none; }
.link-btn:active:not(:disabled) { background: var(--accent-soft); }
.icon-btn:active { background: var(--surface-2); }
.btn:disabled { cursor: not-allowed; color: #7b8a9f; background: var(--surface-2); border-color: var(--line); box-shadow: none; }
.btn.primary:disabled { color: #66768c; background: #dbe3ec; border-color: #dbe3ec; }
.btn[aria-busy="true"] { cursor: progress; color: var(--muted); }
.btn.primary[aria-busy="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); opacity: .7; }
.link-btn:disabled { opacity: .55; cursor: progress; }
.link-btn {
  flex: none; min-height: 44px; padding: 6px 10px; border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--accent-text); font-size: var(--fs-body); font-weight: var(--w-em); cursor: pointer;
}
.icon-btn {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; }

input.field {
  width: 100%; min-height: 48px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--ink);
  font-size: var(--fs-title); letter-spacing: .04em;
}
@media (hover: hover) { input.field:hover { border-color: var(--line-strong); } }
input.field:focus { border-color: var(--accent); outline: none; background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
input.secret { -webkit-text-security: disc; }

/* 登入 */
.login { justify-content: center; gap: 20px; padding: 32px 16px 40px; }
.brand { text-align: center; }
.brand-mark {
  width: 56px; height: 56px; margin: 0 auto 12px; display: grid; place-items: center;
  border-radius: var(--radius); background: var(--accent-soft); color: var(--accent-text);
}
.brand-mark svg { width: 30px; height: 30px; }
.brand h1 { margin: 0; font-size: var(--fs-page); line-height: 1.35; letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 8px 0 0; font-size: var(--fs-body); color: var(--muted); }
.form { display: flex; flex-direction: column; gap: 6px; padding: 20px 16px; }
.form label { margin-top: 10px; font-size: var(--fs-small); font-weight: var(--w-em); letter-spacing: .02em; }
.form label:first-child { margin-top: 0; }
.form .btn { width: 100%; margin-top: 16px; }
.login > .fine { text-align: center; text-wrap: balance; }

/* 載入中 */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px 16px; text-align: center; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.center .row { display: flex; gap: 10px; }

/* 上方標題列 */
.bar {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 8px 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar.back { padding-left: 4px; }
.bar-title { flex: 1; min-width: 0; font-size: var(--fs-title); font-weight: var(--w-em); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code-pill {
  flex: none; font-size: var(--fs-micro); padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); background: var(--surface-2); font-variant-numeric: tabular-nums; letter-spacing: .02em;
}

/* 首頁 */
.home { display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 40px; }
/* 結果頁最下面多留空間：iPhone Safari 點畫面最下方會先叫出工具列，按鈕要能捲到離底部遠一點 */
#r-body { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
.home > .sec-title { margin: 8px 0 -6px; }
.hello h2 { margin: 0; font-size: var(--fs-page); line-height: 1.3; letter-spacing: .01em; }
.hello p { margin: 4px 0 0; font-size: var(--fs-small); color: var(--muted); }
.note-box { margin: 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn); font-size: var(--fs-small); font-weight: var(--w-em); line-height: 1.55; }
.resume {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px; text-align: left;
  border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
@media (hover: hover) { .resume:hover { background: var(--accent-strong); } }
.resume:active { background: var(--accent-strong); }
.resume-main { flex: 1; min-width: 0; }
.resume-l, .resume-t, .resume-s { display: block; }
.resume-l { font-size: var(--fs-micro); letter-spacing: .06em; }
.resume-t { margin: 1px 0; font-size: var(--fs-title); font-weight: var(--w-head); line-height: 1.45; }
.resume-s { font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
.resume-go { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; background: rgba(255, 255, 255, .18); }
.resume-go svg { width: 20px; height: 20px; }
.sec-row { display: flex; align-items: center; justify-content: space-between; margin: 6px -4px -10px 0; }
.sec-title { margin: 0; font-size: var(--fs-small); font-weight: var(--w-em); letter-spacing: .08em; color: var(--muted); }
.mods { display: flex; flex-direction: column; gap: 12px; }
.mod {
  width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 14px; text-align: left;
  border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
  cursor: pointer;
}
@media (hover: hover) {
  .mod:hover { border-color: var(--line-strong); box-shadow: var(--shadow-up); }
  .mod.locked:hover { background: var(--surface); box-shadow: none; }
}
.mod:active { background: var(--surface-2); }
.mod.locked { background: var(--surface-2); box-shadow: none; }
.mod.locked:active { background: var(--surface); }
.mod.locked .mod-name { font-weight: var(--w-em); }
.mod.locked .badge { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ring { position: relative; flex: none; width: 52px; height: 52px; }
.ring > svg { display: block; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: var(--ring-w); }
.ring .track { stroke: var(--line); }
.ring .val { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 138.23; }
.ring .val.zero { opacity: 0; }
.mod.done .ring .val { stroke: var(--ok); }
.pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--fs-micro); font-weight: var(--w-head); font-variant-numeric: tabular-nums; }
.mod.done .pct { color: var(--ok); }
.pct svg { width: 20px; height: 20px; }
.lock-ic { flex: none; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.lock-ic svg { width: 22px; height: 22px; }
.mod-main { flex: 1; min-width: 0; display: block; }
.mod-name { display: block; font-size: var(--fs-title); font-weight: var(--w-head); line-height: 1.35; }
.mod-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 6px; font-size: var(--fs-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: var(--fs-micro); font-weight: var(--w-em); line-height: 1.5; }
.badge.done { color: var(--ok); background: var(--ok-soft); }
.badge.doing { color: var(--warn); background: var(--warn-soft); }
.badge.todo { color: var(--muted); background: var(--surface-2); }
.badge.now { color: var(--accent-text); background: var(--accent-soft); }
.chev { flex: none; display: grid; color: var(--muted); }
.chev svg { width: 20px; height: 20px; }
.version { text-align: center; }

/* 主題頁 */
.topic-card { display: flex; flex-direction: column; gap: 4px; padding: 18px 16px 16px; }
.topic-card h3 { margin: 0; font-size: var(--fs-title); line-height: 1.4; }
.topic-card .meta { margin: 0; font-size: var(--fs-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.topic-card .btn { width: 100%; margin-top: 12px; }

/* 教材與複習建議 */
.mat { padding: 18px 16px; }
.mat h3 { margin: 0 0 8px; font-size: var(--fs-title); line-height: 1.45; }
.mat p { margin: 0 0 10px; line-height: 1.75; text-wrap: pretty; }
.mat p:last-child { margin-bottom: 0; }
.src { margin: 8px 0 0; padding-top: 10px; border-top: 1px dashed var(--line); font-size: var(--fs-small); line-height: 1.55; color: var(--muted); overflow-wrap: anywhere; }

/* 練習 */
.qhead { position: sticky; top: 0; z-index: 2; background: var(--surface); padding-top: env(safe-area-inset-top); }
.qbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 4px; }
.qbar-mid { flex: 1; min-width: 0; text-align: center; line-height: 1.35; }
.qbar-t { font-size: var(--fs-body); font-weight: var(--w-em); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qbar-c { font-size: var(--fs-micro); color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--line); }
.progress i { display: block; width: 0; height: 100%; border-radius: 0 999px 999px 0; background: var(--accent); }
/* 最下面多留空間，同上 */
.quiz { display: flex; flex-direction: column; gap: 16px; padding: 16px 16px calc(120px + env(safe-area-inset-bottom)); }
.quiz .btn { width: 100%; }
.case { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; }
.case-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.case-l { flex: none; font-size: var(--fs-micro); font-weight: var(--w-em); letter-spacing: .08em; color: var(--muted); }
.case-dx { min-width: 0; font-size: var(--fs-body); font-weight: var(--w-em); line-height: 1.45; text-align: right; }
.case-brief { margin: 0; font-size: var(--fs-body); text-wrap: pretty; }
.case-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0; padding-top: 10px; border-top: 1px solid var(--line); }
.case-grid > div { min-width: 0; }
.case-grid .wide { grid-column: 1 / -1; }
.case-grid dt { font-size: var(--fs-micro); letter-spacing: .02em; color: var(--muted); }
.case-grid dd { margin: 1px 0 0; font-size: var(--fs-body); font-weight: var(--w-em); line-height: 1.45; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* 仿呼吸器畫面（不放廠牌標誌）。情境資料填了「呼吸器機型」才出現；顏色固定，不跟著深淺色主題變 */
.vp { padding: 5px; border-radius: 10px; line-height: 1.15; font-variant-numeric: tabular-nums; font-family: "Arial", "Helvetica Neue", "Roboto Condensed", sans-serif; }
.vp-top { display: flex; align-items: center; gap: 10px; padding: 4px 8px; font-size: 12px; }
.vp-mode { font-size: 17px; }
.vp-pbw { margin-left: auto; }
.vp-main { display: grid; gap: 2px; margin-top: 2px; }
.vp-waves { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vp-wave { position: relative; flex: 1; min-height: 70px; padding: 15px 4px 3px 24px; }
.vp-wave svg { display: block; width: 100%; height: 100%; min-height: 50px; overflow: visible; }
.vp-wave path { vector-effect: non-scaling-stroke; }
.vp-wave .ax { fill: none; stroke-width: 1; }
.vp-wl { position: absolute; top: 2px; left: 26px; font-size: 11px; }
.vp-sc { position: absolute; left: 4px; font-size: 9px; }
.vp-sc.hi { top: 14px; }
.vp-sc.lo { bottom: 2px; }
.vp-tiles { display: grid; gap: 2px; align-content: stretch; }
.vp-t { display: flex; flex-direction: column; min-width: 0; min-height: 54px; padding: 3px 6px 4px; }
.vp-t span { overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
.vp-t b { margin-top: auto; text-align: right; font-size: 24px; line-height: 1; }
.vp-set { display: flex; gap: 6px; overflow-x: auto; margin-top: 2px; padding: 7px 8px 6px; }
.vp-k { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 50px; }
.vp-k b { font-size: 13px; }
.vp-k span { font-size: 10px; white-space: nowrap; }
.vp-tabs { display: flex; gap: 2px; overflow-x: auto; }
.vp-tabs span { flex: none; padding: 6px 12px; font-size: 11px; font-weight: 700; white-space: nowrap; }
/* Dräger 風格：白底、藍色填色波形、右側數值、圓形設定鈕、下方模式分頁 */
.vp.dr { background: #e3e7ed; color: #1f3f7a; }
.dr .vp-top, .dr .vp-wave, .dr .vp-t, .dr .vp-set { background: #fff; }
.dr .vp-top { border-radius: 6px 6px 0 0; color: #4a5466; }
.dr .vp-mode { color: #1f3f7a; }
.dr .vp-main { grid-template-columns: minmax(0, 1fr) 128px; }
.dr .vp-tiles { grid-template-columns: 1fr 1fr; }
.dr .vp-wave .fill { fill: #1f4f96; }
.dr .vp-wave .ax { stroke: #b9c0cc; }
.dr .vp-wl, .dr .vp-sc, .dr .vp-t span, .dr .vp-k span { color: #4a5466; }
.dr .vp-t span { white-space: normal; line-height: 1.25; }
.dr .vp-wl b { color: #1f3f7a; }
.dr .vp-k b { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #2f6fd0; color: #fff; box-shadow: 0 0 0 3px #dfe8f7; }
.dr .vp-tabs { background: #3a4250; border-radius: 0 0 6px 6px; }
.dr .vp-tabs span { color: #e9ecf1; }
.dr .vp-tabs span.on { background: #fff; color: #1f3f7a; }
/* SERVO 風格：深色底、彩色線條波形、下方數值格、設定列 */
.vp.sv { background: #222; color: #f2f2f2; }
.sv .vp-wave, .sv .vp-t, .sv .vp-k { background: #2d2d2d; }
.sv .vp-t, .sv .vp-k { background: #373737; }
.sv .vp-main { grid-template-columns: minmax(0, 1fr); }
.sv .vp-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sv .vp-wave { border-radius: 4px; }
.sv .vp-wave .line { fill: none; stroke-width: 1.7; stroke-linejoin: round; }
.sv .vp-wave .paw { stroke: #f0a94a; }
.sv .vp-wave .flw { stroke: #66c963; }
.sv .vp-wave .vol { stroke: #66b9cf; }
.sv .vp-wave .ax { stroke: #5c5c5c; }
.sv .vp-wl, .sv .vp-sc, .sv .vp-t span, .sv .vp-k span { color: #d4d4d4; }
.sv .vp-t.p b { color: #f0a94a; }
.sv .vp-t.f b { color: #66c963; }
.sv .vp-t.v b { color: #66b9cf; }
.sv .vp-t b { text-align: center; font-size: 30px; }
.sv .vp-set { padding: 4px 0 0; }
.sv .vp-k { flex: 1; min-width: 56px; padding: 4px 2px 5px; border-radius: 6px; }
.sv .vp-k b { order: 2; font-size: 22px; font-weight: 400; }
@media (max-width: 520px) {
  .dr .vp-main { grid-template-columns: minmax(0, 1fr) 100px; }
  .vp-t b { font-size: 20px; }
  .sv .vp-t b { font-size: 24px; }
}
/* 題幹：加底色和左邊色條，字也比選項大，和下面的選項分開 */
.stem { margin: 4px 0 2px; padding: 14px 16px 15px; border-left: 4px solid #3b5b85; border-radius: var(--radius-sm);
  background: #e2e9f3; color: var(--ink); font-size: 17px; font-weight: var(--w-em); line-height: 1.65; text-wrap: pretty; }
.stem:focus { outline: none; }
/* 下載中的像素小動畫：肺吸氣、吐氣兩格輪流，下面一排方塊跑燈 */
.pix-load { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 0 24px; }
.pix-art { display: block; shape-rendering: crispEdges; }
.pix-art .f-in { animation: pix-in var(--pix-dur, 1.6s) linear infinite; }
.pix-art .f-out { animation: pix-out var(--pix-dur, 1.6s) linear infinite; }
.pix-lungs { width: 128px; height: 104px; }
.pix-bar { display: flex; gap: 4px; }
.pix-bar i { width: 10px; height: 10px; background: var(--line-strong); animation: pix-run 2s linear infinite; }
.pix-load .fine { letter-spacing: .04em; }
@keyframes pix-in { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
@keyframes pix-out { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pix-run { 0%, 9.9% { background: var(--accent); } 10%, 100% { background: var(--line-strong); } }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  width: 100%; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 12px; padding: 14px; text-align: left;
  font-size: var(--fs-body); line-height: 1.6; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: var(--radius-sm); cursor: pointer;
}
.opt:disabled { cursor: default; }
@media (hover: hover) { .opt:hover:not(:disabled):not(.is-sel) { border-color: var(--muted); } }
.opt:active:not(:disabled):not(.is-sel) { background: var(--surface-2); }
.opt:disabled:not(.is-ok):not(.is-bad) { color: var(--muted); }
.opt-key { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 999px; font-size: var(--fs-small); font-weight: var(--w-head); background: var(--surface-2); color: var(--muted); }
.opt-text { flex: 1; min-width: 0; padding-top: 1px; overflow-wrap: anywhere; }
.opt-mark { flex: 0 0 100%; display: flex; align-items: center; gap: 4px; padding-left: 40px; font-size: var(--fs-micro); font-weight: var(--w-em); white-space: nowrap; }
.opt-mark:empty { display: none; }
.opt-mark svg { width: 15px; height: 15px; }
.opt.is-sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.is-sel .opt-key { background: var(--accent); color: var(--surface); }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok); }
.opt.is-ok .opt-key { background: var(--ok); color: var(--surface); }
.opt.is-ok .opt-mark { color: var(--ok); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 0 0 0 1px var(--bad); }
.opt.is-bad .opt-key { background: var(--bad); color: var(--surface); }
.opt.is-bad .opt-mark { color: var(--bad); }
.fb { overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.fb.ok { border-color: #b9dec7; }
.fb.bad { border-color: #f3c9c3; }
.fb-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: var(--fs-title); font-weight: var(--w-head); line-height: 1.4; }
.fb-head svg { flex: none; width: 20px; height: 20px; }
.fb.ok .fb-head { background: var(--ok-soft); color: var(--ok); }
.fb.bad .fb-head { background: var(--bad-soft); color: var(--bad); }
.fb-s { margin-left: auto; font-size: var(--fs-small); font-weight: var(--w-em); color: var(--ink); }
.fb-body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; }
.fb-body h4 { margin: 4px 0 -2px; font-size: var(--fs-small); font-weight: var(--w-em); letter-spacing: .08em; color: var(--muted); }
.fb-body h4:first-child { margin-top: 0; }
.fb-body p { margin: 0; line-height: 1.75; text-wrap: pretty; }
.fb-body .src { margin: 4px 0 0; line-height: 1.55; }
/* 其他選項的說明：前面標選項代號 */
.fb-other { display: flex; gap: 10px; align-items: flex-start; }
.fb-k { flex: none; display: grid; place-items: center; width: 24px; height: 24px; margin-top: 2px; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface-2); font-size: var(--fs-small); font-weight: var(--w-head); line-height: 1; color: var(--muted); }
.fb-other span { min-width: 0; }
.mat .src { margin: 4px 0 0; line-height: 1.55; }

/* 一回練習的結果 */
.score { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 28px 16px 24px; text-align: center; }
.score-n { margin: 2px 0 6px; font-size: 56px; font-weight: 700; line-height: 1.1; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.score-n small { margin-left: 4px; font-size: var(--fs-title); }
.score-l.round { font-size: var(--fs-small); font-weight: var(--w-em); letter-spacing: .08em; }
.score-l.count { padding: 3px 14px; border-radius: 999px; background: var(--surface-2); font-size: var(--fs-small); }
/* 分數等級：像素小圖、等級徽章、一句誇獎或鼓勵 */
.score .pix-art { width: 104px; height: 104px; margin-bottom: 4px; }
.rank { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.rank b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 6px; color: #fff; font-size: 20px; font-weight: 800; line-height: 1; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2); }
.rank span { font-size: var(--fs-title); font-weight: var(--w-head); color: var(--ink); }
.rank.s b { background: #c98a12; } .rank.a b { background: #2f8f5b; } .rank.b b { background: #2f6fd0; } .rank.c b { background: #c0587a; }
.score-msg { max-width: 26em; margin: 10px 0 0; font-size: var(--fs-body); line-height: 1.6; color: var(--ink); text-wrap: pretty; }
.score-l { font-size: var(--fs-body); color: var(--muted); font-variant-numeric: tabular-nums; }
#r-body > .btn { width: 100%; }

/* 老師解鎖 */
dialog {
  width: min(440px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink);
  box-shadow: 0 16px 40px rgba(15, 23, 42, .2);
}
dialog::backdrop { background: rgba(15, 23, 42, .45); }
dialog.fallback[open] { position: fixed; inset: 16px; margin: auto; height: fit-content; z-index: 20; }
.unlock { display: flex; flex-direction: column; gap: 8px; padding: 20px 16px 16px; }
.unlock h2 { margin: 0; font-size: var(--fs-page); line-height: 1.3; letter-spacing: .01em; }
.unlock .topic-line { margin: 0; font-size: var(--fs-body); }
.check {
  display: flex; align-items: center; gap: 10px; min-height: 48px; margin: 8px 0 4px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2);
  font-weight: var(--w-em); cursor: pointer;
}
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.check input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.unlock label.code-label { margin-top: 4px; font-size: var(--fs-small); font-weight: var(--w-em); letter-spacing: .02em; }
.unlock .row { display: flex; gap: 10px; margin-top: 12px; }
.unlock .row .btn { flex: 1; }

.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
  width: max-content; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font-size: var(--fs-body); font-weight: var(--w-em); text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
}

/* ========== 細微動畫（都很短；手機開「減少動態效果」時關閉） ========== */
.btn, .link-btn, .icon-btn, .mod, .resume, .opt, .opt-key, .check, input.field {
  transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, opacity .15s ease, transform .1s ease;
}
.btn:active:not(:disabled), .resume:active, .mod:active, .opt:active:not(:disabled) { transform: scale(.985); }
.progress i { transition: width .4s cubic-bezier(.2, .7, .3, 1); }
@keyframes fade-up { from { opacity: 0; transform: translateY(6px); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes ring-in { from { stroke-dashoffset: 138.23; } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
.login > *, .home > *, .quiz > .case, .quiz > .stem { animation: fade-up .24s ease-out both; }
.mods > *, .opts > * { animation: fade-up .22s ease-out both; }
.mods > :nth-child(2), .opts > :nth-child(2) { animation-delay: .03s; }
.mods > :nth-child(3), .opts > :nth-child(3) { animation-delay: .06s; }
.mods > :nth-child(n+4), .opts > :nth-child(n+4) { animation-delay: .09s; }
.fb, .err, .save-note, .opt-mark { animation: fade-up .24s ease-out both; }
.ring .val { animation: ring-in .7s cubic-bezier(.2, .7, .3, 1) both; }
.toast { animation: toast-in .2s ease-out both; }
dialog[open] { animation: fade-up .2s ease-out both; }
dialog[open]::backdrop { animation: fade-in .2s ease-out both; }
@media (prefers-reduced-motion: reduce) {
  *:not(.spinner), *::before, *::after, ::backdrop {
    animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important;
  }
  /* 不要動畫的人：像素圖停在吸氣那一格，方塊不跑 */
  .pix-load *, .pix-art * { animation: none !important; }
  .pix-art .f-out { opacity: 0; }
}
</style>
</head>
<body>
<main class="app">

  <!-- 載入中（重新整理網頁後，用上次的登入繼續） -->
  <section id="v-loading" class="view center" hidden>
    <div id="l-spin" class="spinner" aria-hidden="true"></div>
    <p id="l-msg" class="fine" role="status">連線中…</p>
    <div id="l-actions" class="row" hidden>
      <button id="b-retry" class="btn primary" type="button">再試一次</button>
      <button id="b-relogin" class="btn" type="button">重新登入</button>
    </div>
  </section>

  <!-- 登入 -->
  <section id="v-login" class="view login" aria-labelledby="login-h">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
      </div>
      <h1 id="login-h">呼吸治療臨床情境練習</h1>
      <p>請輸入研究人員給你的帳號和密碼</p>
    </div>
    <form id="f-login" class="card form" novalidate>
      <label for="in-account">帳號</label>
      <input id="in-account" class="field" type="text" autocomplete="username" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="40">
      <label for="in-password">密碼（4 位數字）</label>
      <input id="in-password" class="field" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4">
      <p id="login-error" class="err" role="alert"></p>
      <button id="b-login" class="btn primary" type="submit">登入</button>
    </form>
    <p class="fine">帳號和密碼印在研究人員給你的紙條上，忘記了請聯絡研究人員。</p>
    <noscript><p class="err">請開啟瀏覽器的 JavaScript 才能使用。</p></noscript>
  </section>

  <!-- 學習首頁 -->
  <section id="v-home" class="view" hidden>
    <header class="bar">
      <span class="bar-title">呼吸治療臨床情境練習</span>
      <span id="h-account" class="code-pill"></span>
      <button id="b-logout" class="link-btn" type="button">登出</button>
    </header>
    <div class="home">
      <div class="hello">
        <h2>學習首頁</h2>
        <p id="h-hint"></p>
      </div>
      <p id="h-preview" class="note-box" hidden>試跑帳號：看得到還沒審查通過的題目。</p>
      <button id="h-resume" class="resume" type="button" hidden>
        <span class="resume-main">
          <span class="resume-l">繼續上次的練習</span>
          <span id="h-resume-t" class="resume-t"></span>
          <span id="h-resume-s" class="resume-s"></span>
        </span>
        <span class="resume-go" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </span>
      </button>
      <div class="sec-row">
        <span class="sec-title">主題模組</span>
        <button id="b-refresh" class="link-btn" type="button">重新整理</button>
      </div>
      <div id="h-topics" class="mods"></div>
      <p id="h-version" class="fine version"></p>
    </div>
  </section>

  <!-- 主題 -->
  <section id="v-topic" class="view" hidden>
    <header class="bar back">
      <button id="b-back" class="icon-btn" type="button" aria-label="回首頁">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span id="t-title" class="bar-title"></span>
    </header>
    <div id="t-body" class="home"></div>
  </section>

  <!-- 重點教材 -->
  <section id="v-mat" class="view" hidden>
    <header class="bar back">
      <button id="b-mat-back" class="icon-btn" type="button" aria-label="回主題">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span id="m-title" class="bar-title"></span>
    </header>
    <div id="m-body" class="home"></div>
  </section>

  <!-- 練習（一題一題作答） -->
  <section id="v-quiz" class="view" hidden>
    <header class="qhead">
      <div class="qbar">
        <button id="b-quiz-back" class="icon-btn" type="button" aria-label="離開練習，回主題">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="qbar-mid">
          <div id="q-topic" class="qbar-t"></div>
          <div id="q-count" class="qbar-c"></div>
        </div>
        <span id="q-round" class="code-pill"></span>
      </div>
      <div class="progress" aria-hidden="true"><i id="q-progress"></i></div>
    </header>
    <div class="quiz">
      <section id="q-case" class="card case" aria-label="病人資料" hidden></section>
      <p id="q-stem" class="stem" tabindex="-1"></p>
      <p id="q-id" class="fine" hidden></p>
      <div id="q-opts" class="opts" role="group" aria-label="選項"></div>
      <div id="q-fb" class="fb" aria-live="polite" hidden></div>
      <p id="q-error" class="err" role="alert"></p>
      <p id="q-save" class="save-note" role="status" hidden></p>
      <button id="b-confirm" class="btn primary" type="button" disabled>確認答案</button>
      <button id="b-next" class="btn primary" type="button" hidden>下一題</button>
    </div>
  </section>

  <!-- 一回練習的結果 -->
  <section id="v-result" class="view" hidden>
    <header class="bar back">
      <button id="b-result-back" class="icon-btn" type="button" aria-label="回主題">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span id="r-title" class="bar-title"></span>
    </header>
    <div id="r-body" class="home"></div>
  </section>

</main>

<!-- 老師解鎖（學生點鎖住的主題時出現） -->
<dialog id="d-unlock" aria-labelledby="u-h">
  <form id="f-unlock" class="unlock" novalidate>
    <h2 id="u-h">老師解鎖</h2>
    <p class="topic-line">主題：<strong id="u-topic"></strong></p>
    <p class="fine">這一頁請老師操作。確認學生已完成這個主題的前測後，勾選下方並輸入您的 6 位數解鎖碼。系統會記錄解鎖的老師和時間。</p>
    <label class="check"><input id="u-confirm" type="checkbox"> 已完成本主題前測</label>
    <label class="code-label" for="u-code">老師的解鎖碼（6 位數字）</label>
    <input id="u-code" class="field secret" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="6" data-lpignore="true" data-1p-ignore="true">
    <p id="u-error" class="err" role="alert"></p>
    <div class="row">
      <button id="b-unlock-cancel" class="btn" type="button">取消</button>
      <button id="b-unlock" class="btn primary" type="submit">解鎖</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  // ====== 設定 ======
  // 後端網址：Apps Script「部署」後拿到、結尾是 /exec 的網址。
  // 之後用「管理部署作業 → 新版本」更新後端，網址不會變；只有另外「新增部署作業」才要改這裡。
  const API_URL = 'https://script.google.com/macros/s/AKfycbx7SnfFcaez6j0CZV4Tajycmt9UwUHG5AEPSayv2n9Du53Dktqj7FE-u8nwuxcYWATZ/exec';
  const TIMEOUT_MS = 30000; // 等後端回應的時間上限
  // =================

  const SESSION_KEY = 'rt-research-session';
  const ANSWER_KEY = 'rt-research-answers'; // 還沒存到後端的答案（不含密碼）
  const BUSY_ERROR = /^系統忙碌/;            // 後端忙碌：和網路不通一樣，等一下再送
  const CONTROL_GROUP = '對照組';
  // 這些後端訊息代表要重新登入
  const AUTH_ERROR = /^(請輸入帳號和密碼|帳號或密碼不正確|密碼輸錯太多次|帳號設定有誤|這個帳號已停用|你的梯次)/;
  const RING = 138.23; // 進度圈的周長（半徑 22）
  const KEYS = ['A', 'B', 'C', 'D'];
  const VIEWS = ['v-loading', 'v-login', 'v-home', 'v-topic', 'v-mat', 'v-quiz', 'v-result'];
  // 情境資料裡另外排版的欄位
  const CASE_BRIEF = '病人簡述';
  const CASE_DX = '診斷或手術';
  // 呼吸器畫面用的欄位（畫成面板時就不再列在下面）；影像欄位等圖片功能做好再顯示
  const VENT_KEYS = ['呼吸器機型', '呼吸器模式', '呼吸器設定', '實測值'];
  const CASE_HIDDEN = ['影像檔名', '影像來源與授權'];

  const $ = id => document.getElementById(id);
  let session = null;      // { account, password }：只存在這個分頁，關掉分頁就清除
  let status = null;       // 最近一次讀到的各主題狀態（login、status 的回應）
  let topicData = {};      // 下載過的主題內容（登出時清掉）
  let current = '';        // 目前所在的主題
  let quiz = null;         // 練習中的狀態
  let reading = null;      // 看教材的計時
  let starting = false;    // 正在開始一回練習（避免連按）
  let startIds = {};       // 開始練習沒有回應時，重送用同一個編號
  let pending = [];        // 還沒送成功的看教材紀錄
  let saves = [];          // 還沒存到後端的答案，照作答順序（也放在這個分頁，重新整理後接著送）
  let pumping = null;      // 正在一筆一筆送答案
  let pumpMore = false;
  let saveTimer = 0;       // 送不成功時，過一下再送
  let saveDelay = 0;
  let navDepth = 0;        // 在瀏覽器「上一頁」裡加了幾層：0 首頁、1 主題頁、2 教材／練習／結果
  let unlockTopic = '';
  let toastTimer = 0;
  const watches = new Set();

  // ---------- 小工具 ----------
  const store = {
    get() {
      try {
        const v = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
        return v && typeof v.account === 'string' && typeof v.password === 'string' ? v : null;
      } catch (e) { return null; }
    },
    set(v) { try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(v)); } catch (e) { /* 無痕模式等情況存不了，就只留在記憶體 */ } },
    clear() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* 同上 */ } }
  };

  // 全形英數字轉半形，去掉前後空白
  const half = s => String(s || '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ').trim();
  const str = v => (v === null || v === undefined ? '' : String(v));

  // 建立元素；文字一律用 textContent 放進去，不解讀成 HTML
  function h(tag, props) {
    const n = document.createElement(tag);
    Object.keys(props || {}).forEach(k => {
      const v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    for (let i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(c => {
        if (c === null || c === undefined || c === false) return;
        n.append(c instanceof Node ? c : String(c));
      });
    }
    return n;
  }

  // 把一串元素（可以有陣列和空值）換成 el 的內容
  function fill(el, list) {
    const out = [];
    (function add(x) {
      if (Array.isArray(x)) x.forEach(add);
      else if (x !== null && x !== undefined && x !== false) out.push(x);
    })(list);
    el.replaceChildren.apply(el, out);
  }

  // 文字依換行分成段落
  function paras(text, empty) {
    const parts = str(text).split(/\n+/).map(s => s.trim()).filter(Boolean);
    if (!parts.length) return empty ? h('p', { class: 'fine', text: empty }) : null;
    return parts.map(s => h('p', { text: s }));
  }

  // 固定的圖示（不含任何外部資料）
  const ICONS = {
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
  };
  function icon(name) {
    const t = document.createElement('template');
    t.innerHTML = ICONS[name];
    const el = t.content.firstChild;
    el.setAttribute('aria-hidden', 'true');
    return el;
  }

  function ring(pct, done) {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', '52');
    svg.setAttribute('height', '52');
    svg.setAttribute('viewBox', '0 0 52 52');
    const track = document.createElementNS(NS, 'circle');
    const val = document.createElementNS(NS, 'circle');
    [track, val].forEach(c => { c.setAttribute('cx', '26'); c.setAttribute('cy', '26'); c.setAttribute('r', '22'); });
    track.setAttribute('class', 'track');
    val.setAttribute('class', pct > 0 ? 'val' : 'val zero');
    val.style.strokeDashoffset = (RING * (1 - Math.min(Math.max(pct, 0), 1))).toFixed(2);
    svg.append(track, val);
    return h('span', { class: 'ring', 'aria-hidden': 'true' }, svg,
      h('span', { class: 'pct' }, done ? icon('check') : Math.round(pct * 100) + '%'));
  }

  // 每筆紀錄的編號：網路不穩重送時，後端看到同一個編號只記一次
  function uid() {
    const a = new Uint32Array(4);
    try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < 4; i++) a[i] = Math.floor(Math.random() * 4294967296); }
    return Array.from(a, x => x.toString(36)).join('');
  }

  // 計時：只算網頁在前景的時間（切到別的 App、關掉螢幕時暫停）
  function stopwatch() {
    let total = 0;
    let since = document.hidden ? null : performance.now();
    const w = {
      pause() { if (since !== null) { total += performance.now() - since; since = null; } },
      resume() { if (since === null) since = performance.now(); },
      seconds() { return Math.round((total + (since === null ? 0 : performance.now() - since)) / 1000); },
      stop() { w.pause(); watches.delete(w); return w.seconds(); }
    };
    watches.add(w);
    return w;
  }

  function show(id) {
    VIEWS.forEach(v => { $(v).hidden = v !== id; });
    window.scrollTo(0, 0);
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
  }

  // 等後端回應時，按鈕不能再按，並顯示「連線中…」
  async function busy(btn, fn) {
    if (btn.disabled) return undefined;
    const label = btn.textContent;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.textContent = '連線中…';
    try {
      return await fn();
    } finally {
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      btn.textContent = label;
    }
  }

  // ---------- 呼叫後端 ----------
  // 用 text/plain 送 JSON（不會觸發跨網域的預檢），每次都帶帳號和密碼。
  // opt.cred：用別的登入（登入時、送出舊的紀錄時）；opt.keepalive：關掉網頁時也要送完
  async function api(action, extra, opt) {
    opt = opt || {};
    const c = opt.cred || session;
    if (!c) return { ok: false, auth: true, error: '請重新登入' };
    const body = JSON.stringify(Object.assign({ action: action, account: c.account, password: c.password }, extra || {}));
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), TIMEOUT_MS) : 0;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: body,
        cache: 'no-store',
        credentials: 'omit',
        redirect: 'follow',
        referrerPolicy: 'no-referrer',
        keepalive: opt.keepalive === true,
        signal: ctrl ? ctrl.signal : undefined
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || typeof data.ok !== 'boolean') throw new Error('回應格式不對');
      if (!data.ok) {
        data.error = String(data.error || '系統忙碌，請稍後再試');
        data.auth = AUTH_ERROR.test(data.error);
      }
      return data;
    } catch (e) {
      return {
        ok: false, network: true,
        error: navigator.onLine === false ? '手機沒有連上網路，請確認網路後再試一次' : '連線失敗，請稍後再試一次'
      };
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  // ---------- 換畫面與返回 ----------
  // 往深一層的畫面走時，在瀏覽器的「上一頁」加一層，手機的返回鍵才會回到上一個畫面，不會直接離開網頁
  function navTo(depth) {
    while (navDepth < depth) {
      try { history.pushState({ rt: navDepth + 1 }, ''); } catch (e) { return; }
      navDepth++;
    }
  }

  function resetNav() {
    navDepth = 0;
    try { history.replaceState({ rt: 0 }, ''); } catch (e) { /* 不支援就只用畫面上的返回 */ }
  }

  // 畫面上的返回按鈕：和手機的返回鍵一樣
  function back() {
    if (navDepth > 0) { history.back(); return; }
    onNavigate($('v-topic').hidden ? 1 : 0);
  }

  function onPop(e) {
    const d = e.state && typeof e.state.rt === 'number' ? e.state.rt : 0;
    const from = navDepth;
    navDepth = d;
    if (d > from) { history.go(from - d); return; } // 「下一頁」或重新整理前留下的紀錄：退回原本那一層
    onNavigate(d);
  }

  function onNavigate(d) {
    closeUnlock();
    leaveSub(false);
    if (!session) return; // 已經登出：留在登入畫面
    if (d >= 1 && current) {
      showTopic(current);
    } else {
      current = '';
      show('v-home');
      refresh();
    }
  }

  // 離開教材或練習畫面：送出看教材的秒數、停止計時
  function leaveSub(quiet) {
    stopReading(false);
    if (!quiz) return;
    const qz = quiz;
    dropQuiz();
    const done = qz.before + qz.answered;
    if (quiet || !(done > 0 && done < qz.total)) return;
    toast(saveTimer && saves.length ? '有答案還沒存到，連上網路後會自動補送' : '進度已儲存，下次從第 ' + (done + 1) + ' 題繼續');
  }

  function dropQuiz() {
    if (!quiz) return;
    quiz.closed = true;
    quiz.roundWatch.stop();
    if (quiz.qWatch) quiz.qWatch.stop();
    quiz = null;
  }

  // ---------- 登入與登出 ----------
  async function onLogin(e) {
    e.preventDefault();
    const err = $('login-error');
    const account = half($('in-account').value);
    const password = half($('in-password').value);
    err.textContent = '';
    if (!account || !password) { err.textContent = '請輸入帳號和密碼'; return; }
    if (!/^\d{4}$/.test(password)) { err.textContent = '密碼是 4 位數字'; return; }
    await busy($('b-login'), async () => {
      const res = await api('login', null, { cred: { account: account, password: password } });
      if (!res.ok) {
        err.textContent = res.error;
        return;
      }
      session = { account: String(res.account || account), password: password };
      store.set(session);
      $('in-password').value = '';
      renderHome(res);
    });
  }

  function logout(msg) {
    leaveSub(true);
    if (!msg) { // 自己按登出：還沒送到的答案和看教材紀錄先送出（密碼錯誤等被登出時就送不了）
      sendAnswersNow();
      pending.forEach(ev => sendEvent(ev, true));
    }
    pending = [];
    saves = [];
    answerStore.save();
    clearTimeout(saveTimer);
    saveTimer = 0;
    saveDelay = 0;
    store.clear();
    session = null;
    status = null;
    topicData = {};
    startIds = {};
    current = '';
    closeUnlock();
    resetNav();
    $('in-password').value = '';
    $('login-error').textContent = msg || '';
    show('v-login');
  }

  // 重新整理網頁後，用這個分頁裡的登入繼續
  async function resume() {
    show('v-loading');
    $('l-spin').hidden = false;
    $('l-actions').hidden = true;
    $('l-msg').textContent = '連線中…';
    const res = await api('status');
    if (res.ok) { renderHome(res); pumpAnswers(); return; }
    if (res.auth) { logout(res.error); return; }
    $('l-spin').hidden = true;
    $('l-msg').textContent = res.error;
    $('l-actions').hidden = false;
  }

  async function refresh(btn) {
    flush();
    const run = async () => {
      const res = await api('status');
      if (!session) return;
      if (res.ok) { if (!$('v-home').hidden) renderHome(res); else { status = res; mergeSaves(); } }
      else if (res.auth) logout(res.error);
      else toast(res.error);
    };
    return btn ? busy(btn, run) : run();
  }

  // ---------- 學習首頁 ----------
  function topicStatus(name) {
    const list = status && Array.isArray(status.topics) ? status.topics : [];
    return list.find(t => t && t.name === name) || null;
  }

  function renderHome(st) {
    status = st;
    mergeSaves();
    const control = st.group === CONTROL_GROUP;
    $('h-account').textContent = String(st.account || (session && session.account) || '');
    $('h-hint').textContent = control ? '四個主題都已開放，可以自由練習。' : '前測完成後，由老師輸入解鎖碼開放主題。';
    $('h-preview').hidden = !st.preview;
    $('h-version').textContent = st.version ? '題庫版本 ' + st.version : '';
    const topics = Array.isArray(st.topics) ? st.topics : [];
    const orders = topics.filter(t => t && t.open && t.order).map(t => Number(t.order) || 0);
    const latest = orders.length ? Math.max.apply(null, orders) : 0;
    const list = $('h-topics');
    list.replaceChildren();
    topics.forEach(t => { if (t && t.name) list.append(t.open ? openCard(t, latest) : lockedCard(t)); });
    if (!list.children.length) list.append(h('p', { class: 'fine', text: '目前沒有主題。' }));
    // 還沒完成的那一回
    const doing = topics.find(t => t && t.name && t.open && t.last && t.last.finished === false && Number(t.total) > 0);
    $('h-resume').hidden = !doing;
    if (doing) {
      const n = Array.isArray(doing.last.answered) ? doing.last.answered.length : 0;
      $('h-resume-t').textContent = String(doing.name);
      $('h-resume-s').textContent = '第 ' + (Number(doing.last.round) || 1) + ' 回：已答 ' + n + '／' + Number(doing.total) + ' 題';
      $('h-resume').onclick = () => openTopic(String(doing.name), true);
    }
    show('v-home');
  }

  function lockedCard(t) {
    return h('button', { type: 'button', class: 'mod locked', 'data-topic': String(t.name), onclick: () => openUnlock(String(t.name)) },
      h('span', { class: 'lock-ic', 'aria-hidden': 'true' }, icon('lock')),
      h('span', { class: 'mod-main' },
        h('span', { class: 'mod-name', text: String(t.name) }),
        h('span', { class: 'mod-meta' },
          h('span', { class: 'badge todo', text: '未開放' }),
          h('span', { text: '請老師輸入解鎖' }))));
  }

  function openCard(t, latest) {
    const total = Number(t.total) || 0;
    const rounds = Number(t.rounds) || 0;
    let pct = 0, done = false, badge, meta;
    if (t.last && t.last.finished === false) {
      const n = Array.isArray(t.last.answered) ? t.last.answered.length : 0;
      pct = total ? n / total : 0;
      badge = h('span', { class: 'badge doing', text: '練習中' });
      meta = '第 ' + (Number(t.last.round) || 1) + ' 回：' + n + '／' + total + ' 題';
    } else if (rounds > 0) {
      done = true;
      pct = 1;
      badge = h('span', { class: 'badge done', text: '已練習 ' + rounds + ' 回' });
      meta = t.best === null || t.best === undefined ? '' : '最高 ' + t.best + ' 分';
    } else {
      badge = h('span', { class: 'badge todo', text: '已開放' });
      meta = total ? '共 ' + total + ' 題' : '題目準備中';
    }
    const now = latest && Number(t.order) === latest ? h('span', { class: 'badge now', text: '本次主題' }) : null;
    return h('button', { type: 'button', class: 'mod' + (done ? ' done' : ''), 'data-topic': String(t.name), onclick: () => openTopic(String(t.name)) },
      ring(pct, done),
      h('span', { class: 'mod-main' },
        h('span', { class: 'mod-name', text: String(t.name) }),
        h('span', { class: 'mod-meta' }, now, badge, meta ? h('span', { text: meta }) : null)),
      h('span', { class: 'chev', 'aria-hidden': 'true' }, icon('chev')));
  }

  // ---------- 老師解鎖 ----------
  function openUnlock(name) {
    const d = $('d-unlock');
    unlockTopic = name;
    $('u-topic').textContent = name;
    $('u-confirm').checked = false;
    $('u-code').value = '';
    $('u-error').textContent = '';
    if (typeof d.showModal === 'function') d.showModal();
    else { d.classList.add('fallback'); d.setAttribute('open', ''); }
    $('u-confirm').focus();
  }

  function closeUnlock() {
    const d = $('d-unlock');
    $('u-code').value = '';
    if (!d.open) return;
    if (typeof d.close === 'function') d.close();
    else d.removeAttribute('open');
  }

  async function onUnlock(e) {
    e.preventDefault();
    const err = $('u-error');
    const code = half($('u-code').value);
    err.textContent = '';
    if (!$('u-confirm').checked) { err.textContent = '請先勾選「已完成本主題前測」'; return; }
    if (!/^\d{6}$/.test(code)) { err.textContent = '請輸入 6 位數解鎖碼'; $('u-code').focus(); return; }
    await busy($('b-unlock'), async () => {
      const topic = unlockTopic;
      const res = await api('unlock', { topic: topic, code: code, confirmed: $('u-confirm').checked === true });
      $('u-code').value = '';
      if (!res.ok) {
        if (res.auth) { logout(res.error); return; }
        err.textContent = res.error;
        $('u-code').focus();
        return;
      }
      closeUnlock();
      toast(res.already ? '「' + topic + '」已經開放了' : '已開放「' + topic + '」');
      await refresh();
    });
  }

  // ---------- 主題頁 ----------
  function questionsOf(name) {
    const d = topicData[name];
    return d && Array.isArray(d.questions) ? d.questions.filter(q => q && q.id) : [];
  }

  // 這一回還沒答的題目（照題庫的順序）
  function remaining(name, last) {
    const done = new Set(Array.isArray(last && last.answered) ? last.answered.map(String) : []);
    return questionsOf(name).filter(q => !done.has(String(q.id)));
  }

  // 從首頁點進主題：每次都重新下載，拿到最新的題庫內容
  async function openTopic(name, thenResume) {
    current = name;
    navTo(1);
    $('t-title').textContent = name;
    fill($('t-body'), pixLoading('下載教材和題目中…'));
    show('v-topic');
    const res = await api('topic', { topic: name });
    if (current !== name || $('v-topic').hidden) return; // 已經離開這一頁
    if (!res.ok) {
      if (res.auth) { logout(res.error); return; }
      fill($('t-body'), [
        h('p', { class: 'err', role: 'alert', text: res.error }),
        h('button', { type: 'button', class: 'btn', text: '再試一次', onclick: () => openTopic(name, thenResume) })]);
      return;
    }
    topicData[name] = res;
    renderTopic(name);
    if (thenResume && $('b-start')) startPractice(name, $('b-start'));
  }

  // 從教材、練習或結果回到主題頁：用已下載的內容，再更新進度
  function showTopic(name) {
    if (!topicData[name]) { openTopic(name); return; }
    $('t-title').textContent = name;
    renderTopic(name);
    show('v-topic');
    refreshTopic(name);
  }

  async function refreshTopic(name) {
    const res = await api('status');
    if (!session) return;
    if (!res.ok) { if (res.auth) logout(res.error); return; }
    if (quiz) return; // 已經開始作答：不要用比較舊的進度蓋掉
    status = res;
    mergeSaves();
    if (current === name && !$('v-topic').hidden && !starting && topicData[name]) renderTopic(name);
  }

  function renderTopic(name) {
    const data = topicData[name];
    const qs = questionsOf(name);
    const mats = Array.isArray(data.materials) ? data.materials : [];
    const t = topicStatus(name) || {};
    const last = t.last || null;
    const rounds = Number(t.rounds) || 0;
    let meta, label = '';
    if (!qs.length) {
      meta = '題目準備中';
    } else if (last && last.finished === false) {
      const n = qs.length - remaining(name, last).length;
      meta = '共 ' + qs.length + ' 題｜第 ' + last.round + ' 回練習中，已答 ' + n + ' 題';
      label = n < qs.length ? '繼續第 ' + last.round + ' 回（第 ' + (n + 1) + ' 題）' : '看第 ' + last.round + ' 回的結果';
    } else {
      const next = (last ? Number(last.round) || 0 : 0) + 1;
      meta = '共 ' + qs.length + ' 題' + (rounds ? '｜已練習 ' + rounds + ' 回' +
        (t.best === null || t.best === undefined ? '' : '，最高 ' + t.best + ' 分') : '');
      label = next > 1 ? '開始第 ' + next + ' 回練習' : '開始練習';
    }
    fill($('t-body'), [
      data.preview ? h('p', { class: 'note-box', text: '試跑帳號：這裡包含還沒審查通過的題目。' }) : null,
      h('section', { class: 'card topic-card', 'aria-labelledby': 't-q-h' },
        h('h3', { id: 't-q-h', text: '練習題' }),
        h('p', { class: 'meta', text: meta }),
        label ? h('button', { type: 'button', id: 'b-start', class: 'btn primary', text: label, onclick: e => startPractice(name, e.currentTarget) }) : null),
      h('section', { class: 'card topic-card', 'aria-labelledby': 't-m-h' },
        h('h3', { id: 't-m-h', text: '重點教材' }),
        h('p', { class: 'meta', text: mats.length ? '共 ' + mats.length + ' 段' : '教材準備中' }),
        mats.length ? h('button', { type: 'button', id: 'b-read', class: 'btn', text: '閱讀教材', onclick: () => openMaterials(name) }) : null),
      data.version ? h('p', { class: 'fine version', text: '題庫版本 ' + data.version }) : null
    ]);
  }

  // ---------- 重點教材 ----------
  function openMaterials(name) {
    const data = topicData[name];
    if (!data) return;
    const mats = Array.isArray(data.materials) ? data.materials : [];
    navTo(2);
    $('m-title').textContent = '重點教材｜' + name;
    fill($('m-body'), mats.map((m, i) => h('article', { class: 'card mat' },
      h('h3', { text: str(m && m.title) || '第 ' + (i + 1) + ' 段' }),
      paras(m && m.content),
      m && m.source ? h('p', { class: 'src', text: '出處：' + m.source }) : null)));
    show('v-mat');
    stopReading(false);
    reading = { topic: name, watch: stopwatch() };
  }

  function stopReading(urgent) {
    if (!reading) return;
    const r = reading;
    reading = null;
    logReading(r.topic, r.watch.stop(), urgent);
  }

  // 看教材的秒數：送不成功的留著，之後再送（同一個編號後端只記一次）
  function logReading(topic, seconds, urgent) {
    if (!session || !(seconds >= 1)) return;
    const ev = { body: { type: '看教材', topic: topic, seconds: seconds, id: uid() }, cred: session, busy: false };
    pending.push(ev);
    sendEvent(ev, urgent);
  }

  async function sendEvent(ev, urgent) {
    if (ev.busy) return;
    ev.busy = true;
    const res = await api('event', ev.body, { cred: ev.cred, keepalive: urgent === true });
    ev.busy = false;
    // 成功、或後端不收（例如主題被關閉）就不再送；網路不通的留著
    if (res.ok || !res.network) pending = pending.filter(x => x !== ev);
  }

  function flush() { pending.slice().forEach(ev => sendEvent(ev)); }

  // 可能就此關掉網頁：先把這段看教材的時間送出，回來後再重新計時
  function saveReading() {
    if (!reading) return;
    const r = reading;
    reading = { topic: r.topic, watch: stopwatch() };
    logReading(r.topic, r.watch.stop(), true);
  }

  function onVisibility() {
    if (document.hidden) {
      saveReading();
      sendAnswersNow();
      watches.forEach(w => w.pause());
    } else {
      watches.forEach(w => w.resume());
      flush();
      pumpAnswers();
    }
  }

  // ---------- 存答案：先顯示對錯和解析，答案在背景送到後端 ----------
  const answerStore = {
    load(account) {
      try {
        const v = JSON.parse(sessionStorage.getItem(ANSWER_KEY) || '[]');
        return Array.isArray(v) ? v.filter(s => s && s.account === account && s.body && s.body.id)
          .map(s => ({ account: s.account, body: s.body })) : [];
      } catch (e) { return []; }
    },
    save() {
      try {
        if (saves.length) sessionStorage.setItem(ANSWER_KEY, JSON.stringify(saves.map(s => ({ account: s.account, body: s.body }))));
        else sessionStorage.removeItem(ANSWER_KEY);
      } catch (e) { /* 存不了就只留在記憶體 */ }
    }
  };

  function queueAnswer(body) {
    saves.push({ account: session.account, body: body });
    answerStore.save();
    pumpAnswers();
  }

  function dropSave(s) {
    if (saves.indexOf(s) < 0) return;
    saves = saves.filter(x => x !== s);
    answerStore.save();
    updateSaveNote();
  }

  // 照作答的順序一次送一筆；網路不通或後端忙碌就過一下再送（2、4、8…最多 30 秒）。
  // 重送用同一個編號，後端只記一次
  function pumpAnswers() {
    if (pumping) { pumpMore = true; return pumping; } // 正在送：送完這一輪再看一次有沒有新的答案
    pumping = runPump().finally(() => {
      pumping = null;
      if (pumpMore) { pumpMore = false; pumpAnswers(); }
    });
    return pumping;
  }

  async function runPump() {
    clearTimeout(saveTimer);
    saveTimer = 0;
    let again = false;
    while (session && saves.length) {
      const s = saves[0];
      if (s.account !== session.account) { dropSave(s); continue; } // 別的帳號留下的：不能用這個登入送
      const res = await api('answer', s.body);
      if (!session) return;
      if (res.ok) { dropSave(s); saveDelay = 0; continue; }
      if (res.auth) { logout(res.error); return; }
      if (res.network || BUSY_ERROR.test(res.error)) { again = true; break; }
      dropSave(s); // 後端不收（例如題目被停用）：不再重送
      toast('有一題的答案沒有存到：' + res.error);
    }
    if (again) {
      saveDelay = Math.min(saveDelay ? saveDelay * 2 : 2000, 30000);
      saveTimer = setTimeout(pumpAnswers, saveDelay);
    }
    updateSaveNote();
  }

  // 可能就此關掉網頁或登出：還沒存到的答案馬上用 keepalive 送出
  function sendAnswersNow() {
    if (!session) return;
    const cred = session;
    saves.forEach(s => {
      if (s.account === cred.account) api('answer', s.body, { cred: cred, keepalive: true }).then(res => { if (res.ok) dropSave(s); });
    });
  }

  // 送不成功、正在等重送時，練習畫面上說明（平常不顯示）
  function updateSaveNote() {
    const n = saveTimer ? saves.length : 0;
    $('q-save').hidden = !n;
    $('q-save').textContent = n ? '網路不穩：有 ' + n + ' 題的答案還沒存到，連上網路後會自動補送' : '';
  }

  // 這一回的答案都存到了，才能算成績
  async function answersSaved(topic, round) {
    const left = () => saves.some(s => s.body.topic === topic && s.body.round === round);
    for (let i = 0; i < 2 && session && left(); i++) {
      if (!pumping) { clearTimeout(saveTimer); saveTimer = 0; saveDelay = 0; }
      await pumpAnswers();
    }
    return !left();
  }

  // 後端的進度還沒算到正在送的答案：先算進去，接著做時才不會再出同一題
  function mergeSaves() {
    saves.forEach(s => {
      const t = topicStatus(s.body.topic);
      if (t && t.last && Number(t.last.round) === Number(s.body.round) && t.last.finished === false) {
        markAnswered(s.body.topic, Number(s.body.round), String(s.body.qid));
      }
    });
  }

  // ---------- 練習 ----------
  function setLast(name, last) {
    const t = topicStatus(name);
    if (t) t.last = last;
  }

  function markAnswered(name, round, qid) {
    const t = topicStatus(name);
    if (!t) return;
    if (!t.last || Number(t.last.round) !== round || t.last.finished !== false) t.last = { round: round, finished: false, answered: [] };
    if (!Array.isArray(t.last.answered)) t.last.answered = [];
    if (t.last.answered.indexOf(qid) < 0) t.last.answered.push(qid);
  }

  async function startPractice(name, btn) {
    if (starting || !topicData[name]) return;
    const qs = questionsOf(name);
    if (!qs.length) return;
    const t = topicStatus(name);
    const last = t && t.last;
    const run = async () => {
      if (last && last.finished === false) { // 接著做還沒完成的那一回
        const rest = remaining(name, last);
        if (rest.length) { beginQuiz(name, Number(last.round), rest, qs.length - rest.length); return; }
        const res = await finishRound(name, Number(last.round), 0); // 題目都答完了，只差看結果
        if (!res.ok) { if (!res.auth) toast(res.error); return; }
        if (current === name && !$('v-topic').hidden) { navTo(2); renderResult(name, res); }
        return;
      }
      const id = startIds[name] || (startIds[name] = uid());
      const res = await api('start', { topic: name, id: id });
      if (!res.ok) { if (res.auth) logout(res.error); else toast(res.error); return; }
      delete startIds[name];
      if (current !== name || ($('v-topic').hidden && $('v-result').hidden)) return; // 已經離開
      setLast(name, { round: Number(res.round), finished: false, answered: [] });
      beginQuiz(name, Number(res.round), qs, 0);
    };
    starting = true;
    try {
      await (btn ? busy(btn, run) : run());
    } finally {
      starting = false;
    }
  }

  function beginQuiz(name, round, list, before) {
    stopReading(false);
    dropQuiz();
    navTo(2);
    quiz = {
      topic: name, round: round, list: list, idx: 0, before: before, total: before + list.length, answered: 0,
      roundWatch: stopwatch(), qWatch: null, picked: '', phase: 'ask', closed: false
    };
    $('q-topic').textContent = name;
    $('q-round').textContent = '第 ' + round + ' 回';
    show('v-quiz');
    renderQuestion();
  }

  function renderQuestion() {
    const qz = quiz, q = qz.list[qz.idx];
    const pos = qz.before + qz.idx + 1;
    const data = topicData[qz.topic] || {};
    $('q-count').textContent = '第 ' + pos + ' 題／共 ' + qz.total + ' 題';
    $('q-progress').style.width = ((pos - 1) / qz.total * 100).toFixed(1) + '%';
    renderCase(data.scenarios, q.scenario);
    $('q-stem').textContent = str(q.stem);
    $('q-id').hidden = !data.preview;
    $('q-id').textContent = data.preview ? '試跑帳號才看得到：題目 ID ' + q.id : '';
    fill($('q-opts'), KEYS.map(k => h('button', { type: 'button', class: 'opt', 'data-key': k, 'aria-pressed': 'false', onclick: () => pick(k) },
      h('span', { class: 'opt-key', text: k }),
      h('span', { class: 'opt-text', text: str(q.options && q.options[k]) }),
      h('span', { class: 'opt-mark' }))));
    $('q-fb').hidden = true;
    $('q-fb').replaceChildren();
    $('q-error').textContent = '';
    $('b-confirm').textContent = '確認答案';
    $('b-confirm').hidden = false;
    $('b-confirm').disabled = true;
    $('b-next').hidden = true;
    qz.picked = '';
    qz.phase = 'ask';
    updateSaveNote();
    if (qz.qWatch) qz.qWatch.stop();
    qz.qWatch = stopwatch();
    window.scrollTo(0, 0);
    try { $('q-stem').focus({ preventScroll: true }); } catch (e) { /* 舊瀏覽器 */ }
  }

  // 病人資料：情境資料表的欄位和值（沒填的欄位後端不會送）
  function renderCase(scenarios, id) {
    const box = $('q-case');
    const pairs = id && scenarios && Array.isArray(scenarios[id]) ? scenarios[id].filter(p => Array.isArray(p) && p.length >= 2 && str(p[1]).trim() !== '') : [];
    if (!pairs.length) { box.hidden = true; box.replaceChildren(); return; }
    const get = name => { const p = pairs.find(x => str(x[0]) === name); return p ? str(p[1]) : ''; };
    const panel = ventPanel(get);
    const hide = name => name === CASE_BRIEF || name === CASE_DX || CASE_HIDDEN.indexOf(name) >= 0 || (panel && VENT_KEYS.indexOf(name) >= 0);
    const rest = pairs.filter(p => !hide(str(p[0])));
    fill(box, [
      h('div', { class: 'case-head' },
        h('span', { class: 'case-l', text: '病人資料' }),
        get(CASE_DX) ? h('span', { class: 'case-dx', text: get(CASE_DX) }) : null),
      get(CASE_BRIEF) ? h('p', { class: 'case-brief', text: get(CASE_BRIEF) }) : null,
      panel,
      rest.length ? h('dl', { class: 'case-grid' }, rest.map(p => h('div', { class: str(p[1]).length > 12 ? 'wide' : null },
        h('dt', { text: str(p[0]) }),
        h('dd', { text: str(p[1]) })))) : null
    ]);
    box.hidden = false;
  }

  // ====== 仿呼吸器畫面 ======
  // 「呼吸器設定」「實測值」寫成「名稱 數字」，用分號隔開，例如「VT 360; RR 12; PEEP 8; FiO2 50; Ti 1.2」
  const VENT_ALIAS = {
    vt: 'vt', tv: 'vt', tidalvolume: 'vt', rr: 'rr', f: 'rr', rrtot: 'rr', peep: 'peep', fio2: 'fio2', o2: 'fio2', o2conc: 'fio2',
    ti: 'ti', ps: 'ps', psupp: 'ps', 'δpsupp': 'ps', psabovepeep: 'ps', pinsp: 'pinsp', pc: 'pinsp', pcabovepeep: 'pinsp',
    slope: 'slope', flow: 'flow', pbw: 'pbw', ppeak: 'ppeak', pip: 'ppeak', pplat: 'pplat', pmean: 'pmean',
    vte: 'vte', mve: 'mve', mv: 'mve', rrspon: 'rrspon', peepi: 'peepi', autopeep: 'peepi'
  };
  function ventValues(text) {
    const out = {};
    str(text).split(/[;；,，\n]+/).forEach(part => {
      const m = half(part).match(/^\s*([A-Za-zΔ][A-Za-z0-9Δ₂ .-]*?)[\s:=：]+(-?\d+(?:\.\d+)?)/);
      if (!m) return;
      const key = VENT_ALIAS[m[1].toLowerCase().replace(/₂/g, '2').replace(/[\s.-]/g, '')];
      if (!key || out[key]) return;
      let n = Number(m[2]), t = m[2];
      if (key === 'fio2' && n > 0 && n <= 1) { n = Math.round(n * 100); t = String(n); }
      out[key] = { n, t };
    });
    return out;
  }

  // 依設定算出兩個呼吸週期的 [壓力, 流量 L/min, 容積 mL]：有 VT 用定容（方波流量＋吸氣末停頓），否則用定壓
  function ventWaves(set, meas) {
    const num = (o, k, d) => (o[k] ? o[k].n : d);
    const peep = num(set, 'peep', num(meas, 'peep', 5));
    const rr = Math.max(4, Math.min(40, num(meas, 'rr', num(set, 'rr', 15))));
    const cycle = 60 / rr;
    const vc = !!set.vt;
    const P = vc ? 0 : num(set, 'pinsp', num(set, 'ps', 0));
    const ti = Math.min(num(set, 'ti', vc ? cycle / 3 : (set.pinsp ? 1.0 : 0.9)), cycle * 0.6);
    let sample;
    if (vc) {
      const vt = set.vt.n / 1000;
      let pplat = num(meas, 'pplat', peep + vt / 0.04);
      if (pplat <= peep) pplat = peep + 5;
      let ppeak = num(meas, 'ppeak', pplat + 6);
      if (ppeak <= pplat) ppeak = pplat + 1;
      const pause = Math.min(0.3, ti * 0.2), rise = 0.06, tf = ti - pause;
      const flow = vt / (tf - rise / 2), R = (ppeak - pplat) / flow, C = vt / (pplat - peep), tau = R * C;
      sample = tc => {
        if (tc < tf) {
          const f = tc < rise ? flow * tc / rise : flow;
          const v = tc < rise ? flow * tc * tc / (2 * rise) : flow * (tc - rise / 2);
          return [peep + f * R + v / C, f * 60, v * 1000];
        }
        if (tc < ti) return [pplat + (ppeak - pplat) * Math.exp(-(tc - tf) / 0.04), 0, vt * 1000];
        const te = tc - ti, e = Math.exp(-te / tau);
        return [peep + (pplat - peep) * Math.exp(-te / 0.03), -(vt / tau) * e * 60, vt * e * 1000];
      };
    } else {
      const C = meas.vte && P > 0 ? meas.vte.n / 1000 / P : 0.04, R = 10, tau = Math.max(0.05, R * C);
      const vEnd = P * C * (1 - Math.exp(-ti / tau));
      sample = tc => {
        if (tc < ti) { const e = Math.exp(-tc / tau); return [peep + P * Math.min(1, tc / 0.05), P / R * e * 60, P * C * (1 - e) * 1000]; }
        const e = Math.exp(-(tc - ti) / tau);
        return [peep, -(vEnd / tau) * e * 60, vEnd * e * 1000];
      };
    }
    const start = 0.3, span = start + 2 * cycle + 0.5, n = 480, pts = [];
    for (let i = 0; i <= n; i++) { const t = span * i / n; pts.push(t < start ? [peep, 0, 0] : sample((t - start) % cycle)); }
    return pts;
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k]));
    return n;
  }

  // ====== 下載中的像素小動畫 ======
  // 每個字元是一格：t 氣管、# 肺、h 肺的亮面、d 肺的暗面、. 空白；兩格輪流顯示，看起來像在呼吸
  const PIX_COLORS = { t: '#7aa7c7', '#': '#ee8aa0', h: '#f8c3cf', d: '#c95d76' };
  const PIX_OUT = ['.......tt.......', '.......tt.......', '.......tt.......', '......tttt......', '....##t..t##....',
    '...#h#t..t#h#...', '..##h#....#h##..', '..####....####..', '..####....####..', '..####....####..', '..#####..#####..',
    '...dddd..dddd...', '................'];
  const PIX_IN = ['.......tt.......', '.......tt.......', '.......tt.......', '......tttt......', '...###t..t###...',
    '..#hh#t..t#hh#..', '.##h##....##h##.', '.#####....#####.', '.#####....#####.', '.#####....#####.', '.######..######.',
    '.######..######.', '..ddddd..ddddd..'];
  function pixFrame(rows, cls, colors) {
    const g = svgEl('g', { class: cls });
    rows.forEach((row, y) => Array.from(row).forEach((c, x) => {
      if (colors[c]) g.append(svgEl('rect', { x, y, width: 1, height: 1, fill: colors[c] }));
    }));
    return g;
  }
  // 兩格輪流的像素圖：frames = [第一格, 第二格]，每格是等寬的字串陣列，seconds 是一輪的秒數
  function pixArt(frames, colors, cls, seconds) {
    const w = frames[0][0].length, ht = frames[0].length;
    const svg = svgEl('svg', { class: 'pix-art ' + cls, viewBox: '0 0 ' + w + ' ' + ht, 'aria-hidden': 'true', style: '--pix-dur:' + seconds + 's' });
    svg.append(pixFrame(frames[0], 'f-out', colors), pixFrame(frames[1], 'f-in', colors));
    return svg;
  }
  function pixLoading(message) {
    const svg = pixArt([PIX_OUT, PIX_IN], PIX_COLORS, 'pix-lungs', 1.6);
    const bar = h('div', { class: 'pix-bar', 'aria-hidden': 'true' });
    for (let i = 0; i < 10; i++) bar.append(h('i', { style: 'animation-delay:' + (i * 0.2).toFixed(1) + 's' }));
    return h('div', { class: 'pix-load' }, svg, bar, h('p', { class: 'fine', role: 'status', text: message }));
  }

  // 機型填 Dräger／Evita／V300／V600 畫成 Dräger 風格，填 SERVO 畫成 SERVO 風格；其他機型或沒有數值就照一般欄位列出
  function ventPanel(get) {
    const machine = get('呼吸器機型');
    const kind = /dr[äa]ger|evita|v\s?[36]00/i.test(machine) ? 'dr' : /servo/i.test(machine) ? 'sv' : '';
    if (!kind) return null;
    const set = ventValues(get('呼吸器設定')), meas = ventValues(get('實測值'));
    if (!Object.keys(set).length && !Object.keys(meas).length) return null;
    const dr = kind === 'dr', pu = dr ? 'mbar' : 'cmH₂O', vu = dr ? 'mL' : 'ml';
    const mode = half(get('呼吸器模式')) || (set.vt ? 'VC-AC' : set.pinsp ? 'PC-AC' : set.ps ? 'CPAP/PS' : '');
    const label = [machine, mode, get('呼吸器設定'), get('實測值')].filter(Boolean).join('；');

    const w = ventWaves(set, meas);
    const max = j => Math.max.apply(null, w.map(p => Math.abs(p[j])));
    const pawHi = Math.max(20, Math.ceil((max(0) + 5) / 10) * 10);
    const flLim = Math.max(40, Math.ceil(max(1) / 20) * 20);
    const volHi = Math.max(200, Math.ceil(max(2) * 1.15 / 100) * 100);
    const specs = [['paw', 'Paw', pu, 0, pawHi], ['flw', 'Flow', dr ? 'L/min' : 'l/min', -flLim, flLim], ['vol', dr ? 'Volume' : 'V', vu, 0, volHi]];
    const waves = specs.map((s, j) => {
      const lo = s[3], hi = s[4];
      const y = v => Math.max(0, Math.min(100, 100 - (v - lo) / (hi - lo) * 100)).toFixed(1);
      const base = y(0);
      let d = '';
      w.forEach((p, i) => { d += (i ? 'L' : 'M') + (300 * i / (w.length - 1)).toFixed(1) + ' ' + y(p[j]); });
      const svg = svgEl('svg', { viewBox: '0 0 300 100', preserveAspectRatio: 'none' });
      svg.append(dr ? svgEl('path', { class: 'fill', d: 'M0 ' + base + 'L' + d.slice(1) + 'L300 ' + base + 'Z' }) : svgEl('path', { class: 'line ' + s[0], d }));
      svg.append(svgEl('path', { class: 'ax', d: 'M0 ' + base + 'H300' }));
      return h('div', { class: 'vp-wave' },
        dr ? h('span', { class: 'vp-wl' }, h('b', { text: s[1] }), ' ' + s[2]) : h('span', { class: 'vp-wl', text: s[1] + ' (' + s[2] + ')' }),
        h('span', { class: 'vp-sc hi', text: String(hi) }), h('span', { class: 'vp-sc lo', text: String(lo) }), svg);
    });

    // 數值格：實測值優先；FiO2、PEEP、RR 沒有實測值就用設定值
    const val = k => meas[k] || (['fio2', 'peep', 'rr'].indexOf(k) >= 0 ? set[k] : null);
    const TILES = dr
      ? [['fio2', 'FiO2', '%'], ['mve', 'MVe', 'L/min'], ['vte', 'VTe', vu], ['ppeak', 'Ppeak', pu], ['pplat', 'Pplat', pu], ['pmean', 'Pmean', pu],
         ['peep', 'PEEP', pu], ['peepi', 'PEEPi', pu], ['rr', 'RR', '/min'], ['rrspon', 'RRspon', '/min']]
      : [['ppeak', 'Ppeak', pu, 'p'], ['pplat', 'Pplat', pu, 'p'], ['peep', 'PEEP', pu, 'p'], ['pmean', 'Pmean', pu, 'p'], ['peepi', 'PEEPi', pu, 'p'],
         ['rr', 'RR', 'b/min', 'f'], ['rrspon', 'RRspon', 'b/min', 'f'], ['fio2', 'O₂ conc.', '%', 'f'], ['mve', 'MVe', 'l/min', 'v'], ['vte', 'VTe', vu, 'v']];
    const tiles = TILES.filter(t => val(t[0])).map(t => h('div', { class: 'vp-t ' + (t[3] || '') },
      h('span', { text: t[1] + ' ' + t[2] }), h('b', { text: val(t[0]).t })));
    const KNOBS = dr
      ? [['fio2', 'FiO2'], ['vt', 'VT'], ['pinsp', 'Pinsp'], ['ps', 'ΔPsupp'], ['ti', 'Ti'], ['rr', 'RR'], ['peep', 'PEEP'], ['slope', 'Slope'], ['flow', 'Flow']]
      : [['fio2', 'O₂ conc.'], ['peep', 'PEEP'], ['rr', 'RR'], ['vt', 'Tidal volume'], ['pinsp', 'PC above PEEP'], ['ps', 'PS above PEEP'], ['ti', 'Ti']];
    const knobs = KNOBS.filter(k => set[k[0]]).map(k => h('div', { class: 'vp-k' }, h('b', { text: set[k[0]].t }), h('span', { text: k[1] })));
    let tabs = null;
    if (dr) {
      const names = ['VC-AC', 'VC-SIMV', 'PC-AC', 'SPN-CPAP/PS'];
      if (mode && !names.some(x => x.toLowerCase() === mode.toLowerCase())) names.unshift(mode);
      tabs = h('div', { class: 'vp-tabs' }, names.map(x => h('span', { class: x.toLowerCase() === mode.toLowerCase() ? 'on' : null, text: x })));
    }
    return h('div', { class: 'vp ' + kind, role: 'img', 'aria-label': '呼吸器畫面：' + label },
      h('div', { class: 'vp-top' }, h('span', { class: 'vp-mode', text: mode || '—' }),
        set.pbw ? h('span', { class: 'vp-pbw', text: 'PBW ' + set.pbw.t + ' kg' }) : null),
      h('div', { class: 'vp-main' }, h('div', { class: 'vp-waves' }, waves), tiles.length ? h('div', { class: 'vp-tiles' }, tiles) : null),
      knobs.length ? h('div', { class: 'vp-set' }, knobs) : null,
      tabs);
  }

  function optButtons() { return Array.from($('q-opts').querySelectorAll('.opt')); }

  function pick(k) {
    if (!quiz || quiz.phase !== 'ask') return;
    quiz.picked = k;
    optButtons().forEach(b => {
      const on = b.getAttribute('data-key') === k;
      b.classList.toggle('is-sel', on);
      b.setAttribute('aria-pressed', String(on));
    });
    $('b-confirm').disabled = false;
    keepAboveBottom($('b-confirm'));
  }

  // 按鈕太靠近畫面最下方時往上捲一點，避開 iPhone Safari 最下方的工具列區（點那裡會先叫出工具列，要點第二次）
  function keepAboveBottom(el) {
    const gap = 110, r = el.getBoundingClientRect(), vh = window.innerHeight;
    if (r.bottom > vh - gap && r.top > 0) {
      const smooth = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      window.scrollBy({ top: r.bottom - (vh - gap), behavior: smooth ? 'smooth' : 'auto' });
    }
  }

  // 確認答案：馬上顯示對錯和解析（下載的題目裡就有答案），答案在背景存到後端。確認後不能再改
  function onConfirm() {
    const qz = quiz;
    if (!qz || !qz.picked || qz.phase !== 'ask') return;
    const q = qz.list[qz.idx];
    qz.phase = 'shown';
    qz.answered++;
    markAnswered(qz.topic, qz.round, String(q.id));
    queueAnswer({ topic: qz.topic, round: qz.round, qid: q.id, choice: qz.picked, seconds: qz.qWatch.stop(), id: uid() });
    showFeedback(q, qz.picked, qz.picked === str(q.answer));
  }

  // 誘答選項說明每一行依錯誤選項的順序寫；行數和錯誤選項數一樣時，前面標出選項代號，不一樣就照原文列出
  function otherNotes(text, ans) {
    const lines = str(text).split(/\n+/).map(s => s.trim()).filter(Boolean);
    if (!lines.length) return null;
    const keys = optButtons().map(b => b.getAttribute('data-key')).filter(k => k !== ans);
    if (keys.length !== lines.length) return lines.map(s => h('p', { text: s }));
    return lines.map((s, i) => h('p', { class: 'fb-other' }, h('b', { class: 'fb-k', 'aria-label': '選項 ' + keys[i], text: keys[i] }), h('span', { text: s })));
  }

  function showFeedback(q, picked, correct) {
    const qz = quiz;
    const ans = str(q.answer);
    optButtons().forEach(b => {
      const k = b.getAttribute('data-key');
      const mark = b.querySelector('.opt-mark');
      b.classList.remove('is-sel');
      b.disabled = true;
      if (k === ans) { b.classList.add('is-ok'); mark.replaceChildren(icon('check'), k === picked ? '你的答案' : '正確答案'); }
      else if (k === picked) { b.classList.add('is-bad'); mark.replaceChildren(icon('cross'), '你的答案'); }
    });
    const fb = $('q-fb');
    const others = otherNotes(q.distractors, ans);
    fb.className = 'fb ' + (correct ? 'ok' : 'bad');
    fill(fb, [
      h('div', { class: 'fb-head' },
        icon(correct ? 'check' : 'cross'),
        h('span', { text: correct ? '答對了' : '答錯了' }),
        correct ? null : h('span', { class: 'fb-s', text: '正確答案是 ' + ans })),
      h('div', { class: 'fb-body' },
        h('h4', { text: '解析' }),
        paras(q.explanation, '這一題還沒有解析。'),
        others ? h('h4', { text: '其他選項' }) : null,
        others,
        q.source ? h('p', { class: 'src', text: '出處：' + q.source }) : null)
    ]);
    fb.hidden = false;
    $('b-confirm').hidden = true;
    $('b-next').textContent = qz.idx < qz.list.length - 1 ? '下一題' : '看本回結果';
    $('b-next').hidden = false;
    $('q-progress').style.width = ((qz.before + qz.idx + 1) / qz.total * 100).toFixed(1) + '%';
    const top = fb.getBoundingClientRect().top;
    if (top > window.innerHeight * 0.65) window.scrollBy(0, top - window.innerHeight * 0.3);
    try { $('b-next').focus({ preventScroll: true }); } catch (e) { /* 舊瀏覽器 */ }
  }

  async function onNext() {
    const qz = quiz;
    if (!qz || qz.phase !== 'shown') return;
    if (qz.idx < qz.list.length - 1) { qz.idx++; renderQuestion(); return; }
    $('q-error').textContent = '';
    await busy($('b-next'), async () => {
      const res = await finishRound(qz.topic, qz.round, qz.roundWatch.seconds());
      if (qz.closed || quiz !== qz) return;
      if (!res.ok) { if (!res.auth) $('q-error').textContent = res.error; return; }
      dropQuiz();
      renderResult(qz.topic, res);
    });
  }

  async function finishRound(name, round, seconds) {
    if (!(await answersSaved(name, round))) return { ok: false, error: '還有答案還沒存到，請確認網路後再試一次' };
    const res = await api('finish', { topic: name, round: round, seconds: seconds });
    if (!res.ok) { if (res.auth) logout(res.error); return res; }
    const t = topicStatus(name);
    if (t && !(t.last && Number(t.last.round) === round && t.last.finished === true)) {
      const total = Number(res.total) || 0;
      const score = total ? Math.round((Number(res.correct) || 0) / total * 100) : null;
      t.rounds = (Number(t.rounds) || 0) + 1;
      if (score !== null) t.best = Math.max(t.best === null || t.best === undefined ? 0 : Number(t.best), score);
      t.last = { round: round, finished: true };
    }
    return res;
  }

  // ---------- 一回練習的結果 ----------
  // 分數等級：90 以上 S（獎盃閃閃）、75–89 A（星星跳）、60–74 B（心臟跳）、60 以下 C（肺深呼吸）
  const sparkle = (rows, pts) => rows.map((r, y) => Array.from(r).map((c, x) => pts.some(p => p[0] === x && p[1] === y) ? 's' : c).join(''));
