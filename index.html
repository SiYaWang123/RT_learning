  const TROPHY = ['................', '..yyyyyyyyyyyy..', 'y.yhyyyyyyyyyd.y', 'y.yhyyyyyyyyyd.y', '.yyhyyyyyyyyydy.',
    '...hyyyyyyyyd...', '....yyyyyyyd....', '.....yyyyyd.....', '.......yd.......', '.......yd.......',
    '......yyyd......', '....bbbbbbbb....', '....bbbbbbbb....'];
  const PIX_TROPHY = [sparkle(TROPHY, [[0, 0], [14, 3], [1, 9], [13, 12]]), sparkle(TROPHY, [[15, 0], [0, 5], [14, 10], [2, 11]])];
  const PIX_TROPHY_C = { y: '#f2c14e', h: '#fff1b8', d: '#c9962b', b: '#8a6d3b', s: '#ffd23f' };
  const STAR = ['......y......', '.....yyy.....', '.....yhy.....', 'yyyyyyyyyyyyy', '.yyyyyyyyyyy.', '..yykyyykyy..',
    '...yyyyyyy...', '...yykkkyy...', '..yyyy.yyyy..', '..yyy...yyy..', '.yy.......yy.'];
  const PIX_STAR = [['.............', '.............'].concat(STAR, ['...ggggggg...']), STAR.concat(['.............', '.............', '.....ggg.....'])];
  const PIX_STAR_C = { y: '#f5c542', h: '#fff1b8', k: '#5b4316', g: '#c9d3df' };
  const PIX_HEART = [
    ['...........', '...........', '..rr...rr..', '.rrrr.rrrr.', '.rhrrrrrrr.', '.rrrrrrrrr.', '..rrrrrrr..', '...rrrrr...', '....rdr....', '.....d.....', '...........'],
    ['.rrr...rrr.', 'rrrrr.rrrrr', 'rrhrrrrrrrr', 'rhrrrrrrrrr', 'rrrrrrrrrrr', '.rrrrrrrrr.', '..rrrrrrr..', '...rrdrr...', '....rdr....', '.....d.....', '...........']];
  const PIX_HEART_C = { r: '#e2577a', h: '#f7a8bc', d: '#b23c5d' };
  function scoreTier(score) {
    if (score >= 90) return { key: 's', rank: 'S', title: '太厲害了！', art: PIX_TROPHY, colors: PIX_TROPHY_C, sec: 1.2,
      msg: '幾乎全部答對，臨床判斷很穩，繼續保持！' };
    if (score >= 75) return { key: 'a', rank: 'A', title: '表現很棒！', art: PIX_STAR, colors: PIX_STAR_C, sec: 0.8,
      msg: '大部分觀念都掌握了，看一下答錯的題目就更完整。' };
    if (score >= 60) return { key: 'b', rank: 'B', title: '穩穩前進中', art: PIX_HEART, colors: PIX_HEART_C, sec: 0.9,
      msg: '基本觀念已經有了，回頭看看答錯的題目，下一回會更好。' };
    return { key: 'c', rank: 'C', title: '先深呼吸，再來一次', art: [PIX_OUT, PIX_IN], colors: PIX_COLORS, sec: 1.6,
      msg: '這一回比較難沒關係，看完解析再練一回，一定會進步。' };
  }
  function renderResult(name, res) {
    const total = Number(res.total) || 0, right = Number(res.correct) || 0;
    const score = total ? Math.round(right / total * 100) : 0;
    const advice = Array.isArray(res.advice) ? res.advice.filter(a => a && (a.title || a.content)) : [];
    const tier = scoreTier(score);
    $('r-title').textContent = name;
    fill($('r-body'), [
      h('section', { class: 'card score', 'aria-label': '本回成績' },
        pixArt(tier.art, tier.colors, 'pix-' + tier.key, tier.sec),
        h('div', { class: 'rank ' + tier.key }, h('b', { text: tier.rank }), h('span', { text: tier.title })),
        h('span', { class: 'score-l round', text: '第 ' + (Number(res.round) || '') + ' 回練習完成' }),
        h('span', { class: 'score-n' }, String(score), h('small', { text: '分' })),
        h('span', { class: 'score-l count', text: '答對 ' + right + '／' + total + ' 題' }),
        h('p', { class: 'score-msg', text: tier.msg })),
      advice.length ? h('h3', { class: 'sec-title', text: '建議複習' }) : null,
      advice.map(a => h('article', { class: 'card mat' },
        a.title ? h('h3', { text: str(a.title) }) : null,
        paras(a.content),
        a.source ? h('p', { class: 'src', text: '出處：' + a.source }) : null)),
      h('button', { type: 'button', id: 'b-again', class: 'btn primary', text: '再練一回', onclick: e => startPractice(name, e.currentTarget) }),
      h('button', { type: 'button', id: 'b-done', class: 'btn', text: '回主題', onclick: back })
    ]);
    show('v-result');
  }

  // ---------- 開始 ----------
  function init() {
    // 解鎖碼欄位：瀏覽器支援的話用文字欄加遮蔽，避免瀏覽器把老師的解鎖碼當成學生的密碼存起來
    if (!(window.CSS && CSS.supports && CSS.supports('-webkit-text-security', 'disc'))) $('u-code').type = 'password';
    $('f-login').addEventListener('submit', onLogin);
    $('f-unlock').addEventListener('submit', onUnlock);
    $('b-unlock-cancel').addEventListener('click', closeUnlock);
    $('d-unlock').addEventListener('close', () => { $('u-code').value = ''; });
    $('b-logout').addEventListener('click', () => logout(''));
    $('b-refresh').addEventListener('click', e => refresh(e.currentTarget));
    ['b-back', 'b-mat-back', 'b-quiz-back', 'b-result-back'].forEach(id => $(id).addEventListener('click', back));
    $('b-confirm').addEventListener('click', onConfirm);
    $('b-next').addEventListener('click', onNext);
    $('b-retry').addEventListener('click', resume);
    $('b-relogin').addEventListener('click', () => logout(''));
    window.addEventListener('popstate', onPop);
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('pagehide', () => { saveReading(); sendAnswersNow(); watches.forEach(w => w.pause()); });
    window.addEventListener('pageshow', e => { if (e.persisted && !document.hidden) watches.forEach(w => w.resume()); });
    window.addEventListener('online', () => { flush(); pumpAnswers(); });
    resetNav();
    const saved = store.get();
    if (saved) {
      session = saved;
      saves = answerStore.load(saved.account);
      $('in-account').value = saved.account;
      resume();
    } else {
      show('v-login');
    }
    document.documentElement.setAttribute('data-ready', '1');
  }

  init();
})();
</script>
</body>
</html>
